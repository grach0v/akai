# Scene file of the tabletop cell (format: assets/README.md): what the nodes need to know about
# it. Paths are relative to this file. A node can be given any of this through its own config
# instead.

urdf: ../urdf/ur10e_2f85.urdf              # the kinematics: joint names and units of every message
calibration: ../calibration/tabletop.yaml  # the cameras

mujoco:  # the simulation: the MJCF, and the actuators of each controllable part
  model: ../schemas/ur10e_2f85.xml
  parts:  # every MJCF actuator is named after the URDF joint it drives, in that joint's units
    arm: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    gripper: [finger_joint]  # the 2F-85's driver; the rest of its linkage follows it
