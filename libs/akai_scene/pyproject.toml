# akai_scene — the scene descriptor format, shared by every node that reads one (mujoco, rerun,
# web_controller, pink) and by the cell builder (assets/cells/build_cell.py). Format and how to write one: assets/README.md.
#
# A node depends on it by path, editable, so a change here reaches every node:
#   dependencies = [..., "akai_scene"]
#   [tool.uv.sources]
#   akai_scene = { path = "../../libs/akai_scene", editable = true }
[project]
name = "akai_scene"
version = "0.1.0"
description = "The akai scene descriptor: a robot cell's robots and props, and the files and parts the nodes load."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
src = ["src"]
