# Workspace root — a minimal project so `uv run` works from the repo root.
#
# dora pin. Node API (`dora-rs`) and CLI (`dora-rs-cli`) are the same release,
# both prebuilt wheels from PyPI. 1.1.0 is the floor: the layout this repo uses
# (program dataflows in nested directories sharing `modules/` through an
# in-tree symlink) depends on two fixes first released there:
#   - dora-rs/dora#3350  module confinement accepts symlinks inside the project
#   - dora-rs/dora#3465  project root of a symlinked entry file
# Bump both together, and the `dora-rs` pin in every nodes/*/pyproject.toml.
[project]
name = "akai"
version = "0.1.0"
description = "Modular robot control, simulation and training stack built on dora-rs."
requires-python = ">=3.11"
dependencies = [
    "dora-rs==1.1.0",
    "dora-rs-cli==1.1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "ruff>=0.15.18",
]

[tool.uv]
package = false
